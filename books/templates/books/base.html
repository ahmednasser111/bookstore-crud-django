{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; background: #2d3748; color: #fff; margin-bottom: 1.5rem; border-radius: 8px; }
        .nav a { color: #90cdf4; text-decoration: none; margin-left: 1rem; }
        .nav a:hover { color: #fff; }
        .nav-user { font-size: 0.9rem; color: #a0aec0; }
        .messages { list-style: none; padding: 0; margin-bottom: 1rem; }
        .messages li { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; background: #ebf8ff; border: 1px solid #bee3f8; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <strong><a href="{% url 'books.index' %}" style="color:#fff;font-size:1.1rem;">📚 Bookstore</a></strong>
            <div>
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <a href="{% url 'books.create' %}">+ Add Book</a>
                    <form method="post" action="{% url 'books.logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" style="background:none;border:none;color:#90cdf4;cursor:pointer;margin-left:1rem;font-size:1rem;">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'books.login' %}">Login</a>
                    <a href="{% url 'books.signup' %}">Sign Up</a>
                {% endif %}
            </div>
        </nav>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
