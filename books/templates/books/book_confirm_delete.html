{% extends 'books/base.html' %}

{% block content %}
    <h2>Delete Book</h2>
    <div style="margin: 2rem 0; padding: 1.5rem; background: #fff5f5; border-radius: 8px; border: 1px solid #feb2b2;">
        <p style="font-size: 1.1rem;">Are you sure you want to delete "<strong>{{ object.title }}</strong>"?</p>
        <p style="color: #c53030; font-size: 0.9rem; margin-top: 0.5rem;">This action cannot be undone.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{% url 'books.index' %}" class="btn btn-primary">Cancel</a>
        </div>
    </form>
{% endblock %}
