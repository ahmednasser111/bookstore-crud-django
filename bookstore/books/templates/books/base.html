<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 1.5rem;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.5rem;
        }

        h2 {
            margin: 0 0 1rem;
            color: #2c3e50;
        }

        a {
            color: #3498db;
            text-decoration: none;
            margin-right: 0.75rem;
        }

        a:hover {
            text-decoration: underline;
        }

        .book-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #eee;
        }

        .book-item:last-child {
            border-bottom: none;
        }

        .book-title {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .actions {
            margin-top: 1.5rem;
        }

        form p {
            margin: 0 0 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .btn-add {
            display: inline-block;
            background: #27ae60;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }

        .btn-add:hover {
            background: #219a52;
            text-decoration: none;
        }

        .detail p {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bookstore</h1>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
